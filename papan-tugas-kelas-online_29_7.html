        var senderLabel = m.senderRole === 'guru' ? 'Guru' : m.senderName;
        html += '<div class="chat-bubble ' + (mine?'mine':'') + '">' +
          '<div class="cb-meta">' + escapeHtml(senderLabel) + ' &middot; ' + fmtDate(m.timestamp) + '</div>' +
          '<div class="cb-text">' + escapeHtml(m.text) + '</div>' +
          (isGuru ? '<button class="btn small coral cb-del" onclick="__actions.deletePrivateMessage(\'' + m.id + '\')">Hapus</button>' : '') +
        '</div>';
      });
    }
    html += '</div>';
    html += '<div class="chat-input-row">' +
      '<textarea id="chat-input" placeholder="Tulis pesan..."></textarea>' +
      '<button class="btn primary small" onclick="__actions.sendPrivateMessage()">Kirim</button>' +
    '</div>';
    if(isGuru){
      html += '<div style="font-size:0.7rem;color:var(--chalk-dim);margin-top:8px;">Sebagai guru, kamu bisa melihat & menghapus pesan di percakapan mana pun di kelas ini untuk moderasi.</div>';
    }
    return html;
  }

  function renderPesanSiswa(){
    var cls = currentClass();
    var myName = state.identity.name;
    var html = '<p style="font-size:0.8rem;color:var(--chalk-dim);margin:0 0 14px;">Pesan ke sesama siswa tetap bisa dilihat guru untuk menjaga keamanan kelas.</p>';
    html += '<div class="chat-contacts">';
    html += '<div class="chat-contact-row" onclick="__actions.openChatThread(\'' + guruThreadKey(myName) + '\')"><span>👩\u200d🏫 Guru</span><span class="dlr-meta">&rsaquo;</span></div>';
    cls.students.forEach(function(s){
      var name = studentName(s);
      if(name === myName) return;
      html += '<div class="chat-contact-row" onclick="__actions.openChatThread(\'' + peerThreadKey(myName, name) + '\')"><span>' + escapeHtml(name) + '</span><span class="dlr-meta">&rsaquo;</span></div>';
    });
    html += '</div>';
    return html;
  }

  function renderPesanGuru(){
    var cls = currentClass();
    var peerKeys = [];
    state.privateMessages.forEach(function(m){
      if(m.classId === cls.id && m.threadKey.indexOf('PEER::') === 0 && peerKeys.indexOf(m.threadKey) === -1){
        peerKeys.push(m.threadKey);
      }
    });

    var html = '<h3 style="margin-bottom:10px;">Pesan dengan Siswa</h3>';
    html += '<div class="chat-contacts" style="margin-bottom:22px;">';
    if(cls.students.length === 0){
      html += '<div class="empty-state" style="padding:16px;">Belum ada siswa di kelas ini.</div>';
    } else {
      cls.students.forEach(function(s){
        var name = studentName(s);
        html += '<div class="chat-contact-row" onclick="__actions.openChatThread(\'' + guruThreadKey(name) + '\')"><span>' + escapeHtml(name) + '</span><span class="dlr-meta">&rsaquo;</span></div>';
      });
    }
    html += '</div>';

    html += '<h3 style="margin-bottom:6px;">Pantau Percakapan Antar Siswa</h3>';
    html += '<p style="font-size:0.8rem;color:var(--chalk-dim);margin:0 0 12px;">Untuk keamanan, semua percakapan antar siswa di kelas ini bisa kamu lihat dan moderasi di sini.</p>';
    html += '<div class="chat-contacts">';
    if(peerKeys.length === 0){
      html += '<div class="empty-state" style="padding:16px;">Belum ada percakapan antar siswa.</div>';
    } else {
      peerKeys.forEach(function(key){
        var parts = key.slice(6).split('::');
        html += '<div class="chat-contact-row" onclick="__actions.openChatThread(\'' + key + '\')"><span>' + escapeHtml(parts.join(' ↔ ')) + '</span><span class="dlr-meta">&rsaquo;</span></div>';
      });
    }
    html += '</div>';
    return html;
  }

  function renderPengaturanGuru(){
    var html = '<div class="card">' +
      '<h3 style="margin-bottom:10px;">Kode Guru</h3>' +
      '<p style="font-size:0.8rem;color:var(--chalk-dim);margin:0 0 12px;">Kode ini berlaku untuk <b>semua kelas</b> &mdash; diminta setiap kali seseorang mencoba masuk sebagai Guru, supaya siswa tidak bisa masuk sebagai guru. Kosongkan untuk menonaktifkan (siapa saja bisa masuk sebagai guru tanpa kode).</p>' +
      '<div style="display:flex;gap:10px;flex-wrap:wrap;">' +
        '<input type="text" id="f-global-teachercode" placeholder="Kode Guru" value="' + escapeHtml(state.teacherSettings.code||'') + '" style="max-width:220px;">' +
        '<button class="btn primary small" onclick="__actions.saveGlobalTeacherCode()">Simpan</button>' +
      '</div>' +
    '</div>';

    html += '<div class="card">' +
      '<h3 style="margin-bottom:10px;">Semua Kelas</h3>' +
      '<p style="font-size:0.8rem;color:var(--chalk-dim);margin:0 0 12px;">Daftar semua kelas yang kamu kelola. Klik nama kelas untuk langsung berpindah ke sana.</p>';
    if(state.classes.length === 0){
      html += '<div class="empty-state" style="padding:20px;">Belum ada kelas. Klik "+ Kelas Baru" di atas.</div>';
    } else {
      state.classes.forEach(function(c){
        var isActive = currentClass() && currentClass().id === c.id;
        html += '<div class="sub-row">' +
          '<span class="sub-name">' + escapeHtml(c.name) + (isActive ? ' <span class="stamp ok" style="font-size:0.6rem;padding:1px 6px;transform:rotate(0deg);">AKTIF</span>' : '') + '</span>' +
          '<span class="dlr-meta">' + c.students.length + ' siswa</span>' +
        '</div>';
      });
    }
    html += '</div>';
    return html;
  }

  function renderDashboard(){
    var isGuru = state.identity.role === 'guru';
    var tabs = isGuru
      ? [{k:'dashboard', label:'Dashboard'},{k:'tugas', label:'Tugas Kelas'},{k:'kuis', label:'Kuis Kelas'},{k:'rekap', label:'Rekap Nilai'},{k:'jurnal', label:'Jurnal Mengajar'},{k:'bank-soal', label:'Bank Soal'},{k:'pesan', label:'Pesan'},{k:'kelas', label:'Kelas & Siswa'},{k:'pengaturan', label:'Pengaturan'}]
      : [{k:'dashboard', label:'Dashboard'},{k:'tugas', label:'Tugas Saya'},{k:'kuis', label:'Kuis Saya'},{k:'rekap', label:'Nilai Saya'},{k:'pesan', label:'Pesan'}];

    var tabsHtml = '<div class="tabs">';
    tabs.forEach(function(t){
      tabsHtml += '<div class="tab ' + (state.tab===t.k?'active':'') + '" onclick="__actions.setTab(\'' + t.k + '\')">' + t.label + '</div>';
    });
    tabsHtml += '</div>';

    var body;
    if(isGuru){
      var needsClass = ['tugas','kuis','rekap','kelas','pesan','jurnal'].indexOf(state.tab) !== -1;
      if(needsClass && !currentClass()){
        body = '<div class="empty-state" style="padding:50px 20px;"><span class="big">🏫</span>Pilih atau buat kelas dulu lewat tombol "+ Kelas Baru" di atas.</div>';
      } else if(state.tab === 'pesan'){
        body = state.activeChatThread ? renderChatThread(state.activeChatThread) : renderPesanGuru();
      } else {
        body = state.tab === 'dashboard' ? renderGuruDashboard() :
               state.tab === 'tugas' ? renderGuruTugas() :
               state.tab === 'kuis' ? renderGuruKuis() :
               state.tab === 'rekap' ? renderRekapNilai() :
               state.tab === 'jurnal' ? renderJurnalMengajar() :
               state.tab === 'bank-soal' ? renderBankSoal() :
               state.tab === 'kelas' ? renderKelasSiswa() : renderPengaturanGuru();
      }
    } else {
      if(state.tab === 'pesan'){
        body = state.activeChatThread ? renderChatThread(state.activeChatThread) : renderPesanSiswa();
      } else {
        body = state.tab === 'dashboard' ? renderSiswaDashboard() :
               state.tab === 'tugas' ? renderSiswaTugas() :
               state.tab === 'kuis' ? renderSiswaKuis() : renderSiswaNilai();
      }
    }

    return renderHeader() + tabsHtml + body;
  }

  var EXAM_VIOLATION_LIMIT = 3;
  var lockdownEngagedFor = null;

  function registerExamViolation(assignmentId, reasonText){
    var timer = state.quizTimers[assignmentId];
    if(!timer) return;
    timer.violations = (timer.violations || 0) + 1;
    saveExamSession(assignmentId, timer);
    if(timer.violations >= EXAM_VIOLATION_LIMIT){
      window.__actions.submitQuiz(assignmentId, true, 'pelanggaran');
    } else {
      showToast('⚠️ Terdeteksi ' + reasonText + '! Peringatan ke-' + timer.violations + ' dari ' + EXAM_VIOLATION_LIMIT + '. Ulangan bisa otomatis dikumpulkan kalau kelewat batas.');
    }
  }
  function examVisibilityHandler(){
    if(document.hidden && lockdownEngagedFor) registerExamViolation(lockdownEngagedFor, 'kamu meninggalkan halaman ulangan');
  }
  function examBlurHandler(){
    if(lockdownEngagedFor) registerExamViolation(lockdownEngagedFor, 'jendela ulangan kehilangan fokus');
  }
  function examContextMenuHandler(e){
    if(lockdownEngagedFor) e.preventDefault();
  }
  function examBeforeUnloadHandler(e){
    if(lockdownEngagedFor){ e.preventDefault(); e.returnValue = ''; return ''; }
  }
  function examPopStateHandler(){
    if(lockdownEngagedFor){
      showToast('Tidak bisa kembali selagi ulangan berlangsung. Selesaikan dan kumpulkan dulu.');
      try{ history.pushState({examLock:true}, ''); }catch(e){}
    }
  }
  function enterExamLockdown(assignmentId){
    if(lockdownEngagedFor === assignmentId) return;
    var isNewEngage = !lockdownEngagedFor;
    lockdownEngagedFor = assignmentId;
    if(isNewEngage){
      document.addEventListener('visibilitychange', examVisibilityHandler);
      window.addEventListener('blur', examBlurHandler);
      document.addEventListener('contextmenu', examContextMenuHandler);
      window.addEventListener('beforeunload', examBeforeUnloadHandler);
      window.addEventListener('popstate', examPopStateHandler);
      try{ history.pushState({examLock:true}, ''); }catch(e){}
      try{
        var el = document.documentElement;
        var req = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
        if(req){ var p = req.call(el); if(p && p.catch) p.catch(function(){}); }
      }catch(e){}
    }
    document.body.classList.add('exam-lockdown-active');
  }
  function exitExamLockdown(){
    if(!lockdownEngagedFor) return;
    lockdownEngagedFor = null;
    document.removeEventListener('visibilitychange', examVisibilityHandler);
    window.removeEventListener('blur', examBlurHandler);
    document.removeEventListener('contextmenu', examContextMenuHandler);
    window.removeEventListener('beforeunload', examBeforeUnloadHandler);
    window.removeEventListener('popstate', examPopStateHandler);
    document.body.classList.remove('exam-lockdown-active');
    try{
      if(document.fullscreenElement && document.exitFullscreen){ var p2 = document.exitFullscreen(); if(p2 && p2.catch) p2.catch(function(){}); }
    }catch(e){}
  }
  function updateExamLockdownState(){
    if(!state.identity || state.identity.role !== 'siswa'){ exitExamLockdown(); return; }
    var activeQuizId = null;
    Object.keys(state.quizStarted).forEach(function(id){
      if(!state.quizStarted[id]) return;
      var alreadySubmitted = state.submissions.some(function(s){
        return s.assignmentId === id && s.studentName === state.identity.name && s.studentAnswers;
      });
      if(!alreadySubmitted) activeQuizId = id;
    });
    if(activeQuizId) enterExamLockdown(activeQuizId);
    else exitExamLockdown();
  }

  function render(){
    updateExamLockdownState();
    if(state.loading){
      document.body.classList.remove('dashboard-bg');
      app.innerHTML = '<div class="loading">Membuka Bangsal Sinau…</div>';
      return;
    }
    if(!state.identity){
      document.body.classList.remove('dashboard-bg');
      app.innerHTML = renderLogin();
      return;
    }
    if(state.identity.role === 'siswa' && !currentClass()){
      // Kelas siswa ini sudah tidak ada (dihapus) - paksa login ulang.
      state.identity = null;
      state.pickedRole = null;
      state.pickedClassId = null;
      document.body.classList.remove('dashboard-bg');
      app.innerHTML = renderLogin();
      return;
    }
    if(state.identity.role === 'guru' && state.identity.classId && !currentClass()){
      // Kelas aktif guru sudah tidak ada - pindah ke kelas lain kalau ada.
      state.identity.classId = state.classes.length > 0 ? state.classes[0].id : null;
    }
    document.body.classList.add('dashboard-bg');
    app.innerHTML = renderDashboard();
  }

  function tickQuizTimers(){
    Object.keys(state.quizTimers).forEach(function(assignmentId){
      var timer = state.quizTimers[assignmentId];
      if(!timer || timer.autoSubmitted) return;

      // kalau siswa sudah pindah/submit lewat cara lain, hentikan pelacakan
      var alreadySubmitted = state.submissions.some(function(s){
        return s.assignmentId === assignmentId && s.studentName === (state.identity && state.identity.name) && s.studentAnswers;
      });
      if(alreadySubmitted){ delete state.quizTimers[assignmentId]; clearExamSession(assignmentId); return; }
      if(!timer.durationSeconds) return; // kuis tanpa batas waktu, cuma dilacak untuk sesi/pelanggaran

      var elapsed = Math.floor((Date.now() - timer.startedAt) / 1000);
      var remaining = timer.durationSeconds - elapsed;

      if(remaining <= 0){
        timer.autoSubmitted = true;
        window.__actions.submitQuiz(assignmentId, true);
        return;
      }

      var el = document.getElementById('quiz-timer-' + assignmentId);
      if(el){
        var m = Math.floor(remaining / 60), s = remaining % 60;
        el.textContent = (m<10?'0':'')+m + ':' + (s<10?'0':'')+s;
        if(remaining <= 30) el.style.color = 'var(--coral)';
      }
    });
  }
  setInterval(tickQuizTimers, 1000);

  // Kalau dibuka dari tombol landing page (?role=guru atau ?role=siswa),
  // langsung lewati langkah pemilihan peran.
  try{
    var urlParams = new URLSearchParams(window.location.search);
    var roleParam = urlParams.get('role');
    if(roleParam === 'guru' || roleParam === 'siswa'){
      state.pickedRole = roleParam;
    }
  }catch(e){ /* browser lama tanpa URLSearchParams, abaikan */ }

  loadAll();
})();
</script>

</html>
