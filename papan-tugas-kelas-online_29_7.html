  body.dashboard-bg .wrap{
    background:rgba(28,20,15,0.86);
    border-radius:10px;
    box-shadow:0 20px 60px rgba(0,0,0,0.4);
    margin-top:18px;
    margin-bottom:18px;
  }
  @media (max-width:768px){
    body.dashboard-bg{ background-attachment:scroll; }
  }
  /* legibility helpers so header/tab text reads clearly over a brighter, more colorful photo */
  .brand h1, .brand .sub, .who, .tabs .tab{
    text-shadow:0 1px 3px rgba(0,0,0,0.55), 0 2px 10px rgba(0,0,0,0.35);
  }
  .wrap{max-width:1000px;margin:0 auto;padding:28px 20px 80px;}
  h1,h2,h3{font-family:'Cormorant Garamond',serif;font-weight:700;margin:0;}
  .brand{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:28px;flex-wrap:wrap;gap:12px;
  }
  .brand h1{font-size:2.1rem;letter-spacing:0.5px;position:relative;}
  .brand h1 span{color:var(--yellow);}
  .brand .sub{color:var(--chalk-dim);font-size:0.85rem;margin-top:2px;font-family:'Inter';}
  .chalk-rule{
    border:none;height:1px;margin:0 0 26px;
    background:linear-gradient(to right, transparent, var(--line-strong) 12%, var(--line-strong) 88%, transparent);
  }
  .who{
    display:flex;align-items:center;gap:10px;font-size:0.85rem;color:var(--chalk-dim);
  }
  .who b{color:var(--chalk);font-family:'Special Elite';font-weight:600;}
  .btn{
    font-family:'Inter';font-weight:600;font-size:0.85rem;
    border:1.5px solid var(--line-strong);background:transparent;color:var(--chalk);
    padding:9px 16px;border-radius:3px;cursor:pointer;transition:all .15s ease;
  }
  .btn:hover{background:rgba(236,224,196,0.08);}
  .btn.primary{background:var(--yellow);color:#1c140f;border-color:var(--yellow);}
  .btn.primary:hover{background:#dab868;}
  .btn.coral{background:var(--coral);color:#241712;border-color:var(--coral);}
  .btn.coral:hover{background:#d97a63;}
  .btn.small{padding:6px 11px;font-size:0.78rem;}
  .btn.ghost{border-color:transparent;color:var(--chalk-dim);}
  .btn.ghost:hover{color:var(--chalk);background:rgba(236,224,196,0.06);}
  .btn:disabled{opacity:0.4;cursor:not-allowed;}

  /* ---- Login / role picker ---- */
  .login-stage{display:flex;flex-direction:column;align-items:center;padding-top:8vh;text-align:center;position:relative;}
  .login-stage h1{font-size:2.6rem;margin-bottom:6px;}
  .login-stage h1.brand-hero{text-transform:uppercase;letter-spacing:3px;font-size:2.3rem;}
  .login-stage p.tag{color:var(--chalk-dim);margin-bottom:44px;font-size:0.95rem;}

  .teacher-corner-link{
    position:absolute;top:18px;right:14px;
    font-family:'Special Elite',monospace;font-size:0.68rem;letter-spacing:0.5px;
    color:var(--chalk-dim);background:transparent;
    border:1.5px dashed var(--line-strong);border-radius:3px;
    padding:6px 12px;cursor:pointer;transition:all .15s ease;
  }
  .teacher-corner-link:hover{color:var(--yellow);border-color:var(--yellow);}

  .hero-entry{
    width:100%;max-width:380px;margin-top:6px;
    background:var(--bg-card);border:2px solid var(--yellow);border-radius:6px;
    padding:36px 30px;cursor:pointer;position:relative;
    box-shadow:0 10px 30px rgba(0,0,0,0.35);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .hero-entry:hover{transform:translateY(-3px);box-shadow:0 14px 38px rgba(0,0,0,0.45);}
  .hero-entry::before, .hero-entry::after{
    content:'';position:absolute;width:16px;height:16px;border:2px solid var(--yellow);opacity:0.55;
  }
  .hero-entry::before{top:9px;left:9px;border-right:none;border-bottom:none;}
  .hero-entry::after{bottom:9px;right:9px;border-left:none;border-top:none;}
  .hero-entry .hero-icon{font-size:3rem;display:block;margin-bottom:12px;}
  .hero-entry h2{font-size:1.6rem;margin-bottom:8px;}
  .hero-entry p{color:var(--chalk-dim);font-size:0.88rem;margin-bottom:20px;max-width:280px;margin-left:auto;margin-right:auto;}
  .hero-cta{
    display:inline-block;background:var(--yellow);color:var(--bg);
    font-family:'Special Elite',monospace;font-size:0.78rem;letter-spacing:1px;
    padding:10px 22px;border-radius:3px;
  }

  .name-form{margin-top:34px;display:flex;flex-direction:column;align-items:center;gap:14px;}
  input[type=text], input[type=datetime-local], input[type=number], textarea{
    font-family:'Inter';background:var(--bg-alt);border:1.5px solid var(--line);

<script>
(function(){
  "use strict";

  var app = document.getElementById('app');
  var toastEl = document.getElementById('toast');

  // ---------- KONFIGURASI ----------
  // Tempel URL Web App Apps Script kamu di sini (lihat PANDUAN-HUBUNGKAN-SPREADSHEET.md)
  var CONFIG = {
    WEB_APP_URL: 'https://script.google.com/macros/s/AKfycbz-aUTYXmfZh6wISRk6V2xwid6nO5ucMkp0Da1oAiGuupRGgGmTEDg-d5svoajdH_W6gA/exec'
  };

  // Pengganti window.storage: menyimpan/mengambil data lewat Google Apps Script + Google Sheets.
  var storage = {
    _rawGet: async function(key){
      if(!CONFIG.WEB_APP_URL || CONFIG.WEB_APP_URL.indexOf('PASTE_URL') !== -1){
        throw new Error('WEB_APP_URL belum diatur.');
      }
      var res = await fetch(CONFIG.WEB_APP_URL + '?action=get&key=' + encodeURIComponent(key) + '&t=' + Date.now(), { cache: 'no-store' });
      var txt = await res.text();
      var data;
      try{ data = JSON.parse(txt); }catch(e){ throw new Error('server membalas halaman error (bukan JSON)'); }
      if(data && data.error) throw new Error('server: ' + data.error);
      if(!data || data.value == null) return null;
      return { key: data.key, value: data.value };
    },
    _rawSet: async function(key, value){
      if(!CONFIG.WEB_APP_URL || CONFIG.WEB_APP_URL.indexOf('PASTE_URL') !== -1){
        throw new Error('WEB_APP_URL belum diatur.');
      }
      // Coba sampai 3x. Kalau balasan server hilang di jalan, cek dulu apakah data sebenarnya sudah masuk.
      var lastErr = '';
      for(var attempt = 1; attempt <= 3; attempt++){
        var ctrl = new AbortController();
        var timer = setTimeout(function(){ ctrl.abort(); }, 25000);
        try{
          var res = await fetch(CONFIG.WEB_APP_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ action: 'set', key: key, value: value }),
            signal: ctrl.signal
          });
          var text = await res.text();
          clearTimeout(timer);
          var data;
          try{ data = JSON.parse(text); }catch(e){ throw new Error('balasan server bukan JSON'); }
          if(!data) throw new Error('balasan kosong');
          if(data.error){ lastErr = String(data.error); break; }
          // Versi baru Code.gs membalas {saved:true}. Versi lama membalas tanpa tanda ini.
          window.__oldBackend = (data.saved !== true);
          return data;
        }catch(e){
          clearTimeout(timer);
          lastErr = (e && e.name === 'AbortError') ? 'waktu habis' : (e && e.message ? e.message : 'koneksi gagal');
          try{
            await new Promise(function(r){ setTimeout(r, 1500); });
            var back = await storage._rawGet(key);
            if(back && back.value != null && String(back.value) === String(value)){
              return { saved: true, recovered: true };
            }
          }catch(e2){}
        }
      }
      window.__lastSaveError = lastErr;
      return null;
    }
  };

  // Antrean simpan: per key hanya 1 request berjalan; kalau ada simpanan baru saat masih berjalan,
  // yang dikirim berikutnya hanya data TERBARU. Mencegah request menumpuk dan data lama menimpa data baru.
  // PENGAMAN: kalau data gagal dimuat dari server, aplikasi memegang data KOSONG di memori.
  // Menyimpan dalam kondisi itu akan menimpa data asli di spreadsheet, jadi penyimpanan diblokir
  // sampai data berhasil dimuat ulang (refresh halaman).
  var failedLoad = {};
  storage.get = async function(key){
    try{
      var r = await storage._rawGet(key);
      if(r && r.value != null && r.value !== ''){
        try{ JSON.parse(r.value); }
        catch(pe){ throw new Error('isi data "' + key + '" dari server tidak utuh / rusak'); }
      }
      delete failedLoad[key];
      return r;
    }catch(e){
      failedLoad[key] = true;
      try{ showToast('Data "' + key + '" gagal dimuat dari server. Refresh halaman sebelum mengisi nilai.', 10000); }catch(e2){}
      throw e;
    }
  };

  var storageQueue = {};
  storage.set = function(key, value){
    var st = storageQueue[key] || (storageQueue[key] = { running: false, waiters: [], latest: null });
    return new Promise(function(resolve){
      st.latest = value;
      st.waiters.push(resolve);
      if(!st.running) storagePump(key);
    });
  };
  async function storagePump(key){
    var st = storageQueue[key];
    st.running = true;
    while(st.waiters.length){
      var waiters = st.waiters; st.waiters = [];
      var val = st.latest;
      var result = null;
      if(failedLoad[key]){
        window.__lastSaveError = 'data belum berhasil dimuat, penyimpanan diblokir agar data lama tidak tertimpa. Refresh halaman';
        result = null;
      } else {
      try{ result = await storage._rawSet(key, val); }
      catch(e){ window.__lastSaveError = (e && e.message) ? e.message : 'error'; result = null; }
      }
      waiters.forEach(function(r){ r(result); });
    }
    st.running = false;
  }

  // Membaca ulang data dari server setelah menyimpan, lalu membandingkannya.
  async function verifySaved(key, expected){
    var st = storageQueue[key];
    if(st && (st.running || st.waiters.length)) return { ok: true, skipped: true }; // ada simpanan lebih baru, yang itu yang akan dicek
    var lastMsg = '';
    for(var i = 0; i < 3; i++){
      try{
        if(i > 0) await new Promise(function(r){ setTimeout(r, 1500); });
        var back = await storage._rawGet(key);
        var got = (back && back.value != null) ? String(back.value) : '';
        if(got === expected && !window.__oldBackend) return { ok: true };
        var msg = 'PERINGATAN: ';
        if(window.__oldBackend) msg += 'Apps Script masih VERSI LAMA (belum di-deploy Versi baru). ';
        if(got !== expected) msg += 'Data di server BERBEDA dari yang kamu isi (server ' + got.length + ' karakter, seharusnya ' + expected.length + ').';
        lastMsg = msg;
        if(window.__oldBackend) break;
      }catch(e){
        lastMsg = 'PERINGATAN: data sudah dikirim tapi belum bisa dibaca ulang (' + (e && e.message ? e.message : 'error') + '). Coba refresh halaman untuk memastikan.';
      }
    }
    return { ok: false, msg: lastMsg };
  }

  function bulkImportStudents(names){

    var existingLower = cls.students.map(function(s){ return studentName(s).toLowerCase(); });
    var added = 0, skipped = 0;
    names.forEach(function(rawName){

      if(!name) return;
      if(existingLower.indexOf(name.toLowerCase()) !== -1){ skipped++; return; }
      cls.students.push({ name: name, pin: generatePin() });
      existingLower.push(name.toLowerCase());
      added++;

  function syncNewItemForm(){

    }

    if(studentCbs.length > 0){
      state.newItemDraft.targetStudents = Array.prototype.filter.call(studentCbs, function(cb){ return cb.checked; }).map(function(cb){ return cb.value; });
    }

    var blocks = document.querySelectorAll('.quiz-question-block');
    var result = [];
    blocks.forEach(function(block, idx){
      var textEl = document.getElementById('qq-text-' + idx);
      var typeSelect = block.querySelector('.qq-type-select');
      var prevQ = state.newQuizQuestions[idx] || {};
      var qType = typeSelect ? typeSelect.value : questionType(prevQ);
      var q = { type: qType, text: textEl ? textEl.value : '' };

      if(qType === 'pg'){
        var opts = [];
        for(var i=0;i<5;i++){
          var optEl = document.getElementById('qq-opt-' + idx + '-' + i);
          opts.push(optEl ? optEl.value : '');
        }
        var checkedRadio = block.querySelector('input[name="qq-correct-' + idx + '"]:checked');
        q.options = opts;
        q.correctIndex = checkedRadio ? parseInt(checkedRadio.value, 10) : 0;
      } else if(qType === 'pgk'){
        var opts2 = [], correctIdxs = [];
        for(var j=0;j<5;j++){
          var optEl2 = document.getElementById('qq-opt-' + idx + '-' + j);
          opts2.push(optEl2 ? optEl2.value : '');
          var cb = document.getElementById('qq-pgk-correct-' + idx + '-' + j);

        }
        q.options = opts2;
        q.correctIndexes = correctIdxs;
      } else if(qType === 'menjodohkan'){
        var pairs = [];
        var pi = 0;
        while(true){
          var leftEl = document.getElementById('qq-pair-left-' + idx + '-' + pi);
          var rightEl = document.getElementById('qq-pair-right-' + idx + '-' + pi);
          if(!leftEl && !rightEl) break;
          pairs.push({ left: leftEl ? leftEl.value : '', right: rightEl ? rightEl.value : '' });
          pi++;
          if(pi > 50) break; // pengaman, tidak seharusnya pernah kepakai
        }
        q.pairs = pairs.length > 0 ? pairs : (prevQ.pairs || []);
      } else if(qType === 'uraian'){
        var keyEl = document.getElementById('qq-answerkey-' + idx);
        q.answerKey = keyEl ? keyEl.value : (prevQ.answerKey || '');
      }
      result.push(q);
    });
    if(result.length > 0) state.newQuizQuestions = result;
  }

  // Menghitung seberapa "benar" satu soal dijawab, dalam bentuk pecahan 0..1.
  // Pilihan ganda & PG Kompleks: 0 atau 1 (harus persis benar semua).
  // Menjodohkan: proporsional sesuai jumlah pasangan yang benar.
  // Uraian: tidak bisa dinilai otomatis, dikembalikan null (perlu guru menilai manual).
  function questionFraction(q, ans){
    var qType = questionType(q);
    if(qType === 'pgk'){
      var correctSet = (q.correctIndexes || []).slice().sort();
      var chosenSet = Array.isArray(ans) ? ans.slice().sort() : [];
      var same = correctSet.length === chosenSet.length && correctSet.every(function(v,i){ return v === chosenSet[i]; });
      return same ? 1 : 0;
    }
    if(qType === 'menjodohkan'){
      var pairs = q.pairs || [];
      if(pairs.length === 0) return 0;
      var correctCount = 0;
      pairs.forEach(function(p, i){ if(Array.isArray(ans) && ans[i] === i) correctCount++; });
      return correctCount / pairs.length;
    }
    if(qType === 'uraian') return null;
    // pg (default)
    return (ans === q.correctIndex) ? 1 : 0;
  }

  function computeQuizScore(assignment, studentAnswers){
    var questions = assignment.questions;
    var total = questions.length;
    var hasUraian = questions.some(function(q){ return questionType(q) === 'uraian'; });
    var fractionSum = 0;
    var gradableCount = 0;
    var correctCount = 0; // dihitung penuh (fraction===1) untuk info "X benar dari Y", tidak termasuk uraian
    questions.forEach(function(q, idx){
      var f = questionFraction(q, studentAnswers[idx]);
      if(f === null) return; // uraian, dilewati dari perhitungan otomatis
      gradableCount++;
      fractionSum += f;
      if(f === 1) correctCount++;
    });
    var autoScore = gradableCount > 0 ? Math.round((fractionSum / gradableCount) * assignment.maxScore) : null;
    return {
      total: total,
      gradableCount: gradableCount,
      correctCount: correctCount,
      autoScore: autoScore,
      needsManualReview: hasUraian,
      // skor final: kalau ada soal uraian, nilai tidak langsung final - menunggu guru menilai bagian uraiannya.
      score: hasUraian ? null : (autoScore || 0)
    };
  }

  function optionLetter(i){ return String.fromCharCode(65 + i); }

  function renderQuizBreakdown(a, answers){
    var html = '<div style="margin-top:10px;border-top:1px dashed var(--line);padding-top:8px;">';
    a.questions.forEach(function(q, idx){
      var qType = questionType(q);
      var chosen = answers ? answers[idx] : null;
      html += '<div class="quiz-review-row">';
      if(qType === 'pgk'){
        var correctSet = (q.correctIndexes || []).slice().sort();
        var chosenSet = Array.isArray(chosen) ? chosen.slice().sort() : [];
        var isCorrect = correctSet.length === chosenSet.length && correctSet.every(function(v,i){ return v === chosenSet[i]; });
        var chosenLabels = (Array.isArray(chosen) && chosen.length>0) ? chosen.map(function(i){ return optionLetter(i) + '. ' + escapeHtml(q.options[i]||''); }).join(', ') : '(kosong)';
        var correctLabels = correctSet.map(function(i){ return optionLetter(i) + '. ' + escapeHtml(q.options[i]||''); }).join(', ');
        html += escapeHtml(q.text) + ' <span class="qtype-tag">PG Kompleks</span><br>jawaban: ' + chosenLabels +
          '<span class="quiz-badge ' + (isCorrect?'correct':'wrong') + '">' + (isCorrect?'Benar':'Salah') + '</span>' +
          (!isCorrect ? '<div style="color:var(--chalk-dim);font-size:0.78rem;">Jawaban benar: ' + correctLabels + '</div>' : '');
      } else if(qType === 'menjodohkan'){
        var pairs = q.pairs || [];
        var correctCount = 0;
        var rows = pairs.map(function(p, i){
          var chosenRightIdx = Array.isArray(chosen) ? chosen[i] : null;
          var rowCorrect = chosenRightIdx === i;
          if(rowCorrect) correctCount++;
          var chosenText = (chosenRightIdx!=null && pairs[chosenRightIdx]) ? pairs[chosenRightIdx].right : '(kosong)';
          return '<div style="font-size:0.8rem;margin-top:3px;">' + escapeHtml(p.left) + ' &rarr; ' + escapeHtml(chosenText) +
            (rowCorrect ? ' ✅' : ' ❌ <span style="color:var(--chalk-dim);">(harusnya: ' + escapeHtml(p.right) + ')</span>') + '</div>';
        }).join('');
        html += escapeHtml(q.text) + ' <span class="qtype-tag">Menjodohkan</span>' +
          '<span class="quiz-badge ' + (correctCount===pairs.length?'correct':'wrong') + '">' + correctCount + '/' + pairs.length + ' pasangan benar</span>' + rows;
      } else if(qType === 'uraian'){
        html += escapeHtml(q.text) + ' <span class="qtype-tag">Uraian &mdash; dinilai manual</span>' +
          '<div style="margin-top:5px;padding:8px 10px;background:var(--bg-alt);border-radius:4px;font-size:0.85rem;white-space:pre-wrap;">' +
          (chosen ? escapeHtml(chosen) : '<i style="color:var(--chalk-dim);">(kosong)</i>') + '</div>';
      } else {
        var correct = chosen === q.correctIndex;
        html += escapeHtml(q.text) + ' &mdash; jawaban: ' + (chosen!=null ? optionLetter(chosen) + '. ' + escapeHtml(q.options[chosen]||'') : '(kosong)') +
          '<span class="quiz-badge ' + (correct?'correct':'wrong') + '">' + (correct?'Benar':'Salah') + '</span>' +
          (!correct ? '<div style="color:var(--chalk-dim);font-size:0.78rem;">Jawaban benar: ' + optionLetter(q.correctIndex) + '. ' + escapeHtml(q.options[q.correctIndex]) + '</div>' : '');
      }
      html += '</div>';
    });
    html += '</div>';
    return html;
  }

  // Google Drive kadang tidak mau menampilkan gambar langsung lewat tautan "uc?export=view".
  // Fungsi ini mengambil ID file dari tautan apa pun (format lama/baru) lalu membangun
  // tautan "thumbnail" yang jauh lebih andal ditampilkan lewat tag <img>.
  function driveImageSrc(url){
    if(!url) return '';
    var match = url.match(/[?&]id=([a-zA-Z0-9_-]+)/) || url.match(/\/d\/([a-zA-Z0-9_-]+)/);
    var id = match ? match[1] : null;
    return id ? ('https://drive.google.com/thumbnail?id=' + id + '&sz=w1000') : url;
  }

  function fileToBase64(file){
    return new Promise(function(resolve, reject){
      var reader = new FileReader();
      reader.onload = function(){
        var result = reader.result;
        var idx = result.indexOf(',');
        resolve(idx !== -1 ? result.slice(idx + 1) : result);
      };
      reader.onerror = function(){ reject(new Error('Gagal membaca file.')); };
      reader.readAsDataURL(file);
    });
  }

  // Mengunggah gambar (jika ada file dipilih di input dengan id tertentu) dan
  // mengembalikan URL gambarnya. Mengembalikan null jika tidak ada file dipilih.
  async function uploadImageIfAny(inputId){
    var input = document.getElementById(inputId);
    if(!input || !input.files || input.files.length === 0) return null;
    var file = input.files[0];
    if(file.size > 4 * 1024 * 1024){
      throw new Error('Ukuran gambar maksimal 4MB. Coba kompres dulu fotonya.');
    }
    showToast('Mengunggah gambar…');
    var base64 = await fileToBase64(file);
    var res = await fetch(CONFIG.WEB_APP_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'uploadFile', filename: file.name, mimeType: file.type, base64: base64 })
    });
    var data = await res.json();
    if(!data || data.error || !data.url) throw new Error((data && data.error) || 'Gagal mengunggah gambar.');
    return data.url;
  }

  // Memanggil AI (lewat backend Apps Script, supaya API key tidak terbuka di browser).
  async function callAI(prompt, maxTokens){
    var res = await fetch(CONFIG.WEB_APP_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'askAI', prompt: prompt, maxTokens: maxTokens || 1024 })
    });
    var data = await res.json();
    if(!data || data.error || data.text == null) throw new Error((data && data.error) || 'AI tidak memberi jawaban.');
    return data.text;
  }

    generateAIQuestions: async function(){
      if(state.aiLoading) return;
      var topicInput = document.getElementById('ai-quiz-topic');
      var countInput = document.getElementById('ai-quiz-count');
      var levelSelect = document.getElementById('ai-quiz-level');
      var topic = topicInput ? topicInput.value.trim() : '';
      var count = countInput ? (parseInt(countInput.value, 10) || 3) : 3;
      var level = levelSelect ? levelSelect.value : 'sedang';
      if(!topic){ showToast('Isi topik soalnya dulu.'); return; }
      count = Math.max(1, Math.min(10, count));
      syncNewItemForm();
      state.aiLoading = true;
      render();
      try{
        var prompt = 'Buatkan ' + count + ' soal pilihan ganda Bahasa Indonesia tingkat kesulitan ' + level +
          ' tentang topik: "' + topic + '". Setiap soal punya PERSIS 4 pilihan jawaban yang masuk akal (bukan asal-asalan). ' +
          'Balas HANYA dengan JSON array valid, tanpa teks lain, tanpa markdown code fence, tanpa penjelasan, persis format ini: ' +
          '[{"text":"pertanyaan","options":["pilihan A","pilihan B","pilihan C","pilihan D"],"correctIndex":0}]. ' +
          'correctIndex adalah angka index (0-3) dari pilihan yang benar.';
        var raw = await callAI(prompt, 1800);
        var cleaned = raw.replace(/```json|```/g, '').trim();
        var parsed = JSON.parse(cleaned);
        if(!Array.isArray(parsed) || parsed.length === 0) throw new Error('Format jawaban AI tidak sesuai, coba lagi.');
        var mapped = parsed.map(function(q){
          var opts = (q.options || []).slice(0, 5);
          while(opts.length < 5) opts.push('');
          return { text: q.text || '', options: opts, correctIndex: typeof q.correctIndex === 'number' ? q.correctIndex : 0 };
        });
        state.newQuizQuestions = mapped;
        state.showAIQuizHelper = false;
        showToast(mapped.length + ' soal dari AI berhasil dibuat — periksa & sesuaikan sebelum disimpan.');
      }catch(err){
        showToast(err.message || 'Gagal meminta bantuan AI. Coba lagi.');
      }
      state.aiLoading = false;
      render();
    },

    createAssignment: async function(){
      syncNewItemForm();
      var title = document.getElementById('f-title').value.trim();
      var desc = document.getElementById('f-desc').value.trim();
      var deadline = document.getElementById('f-deadline').value;
      var maxScore = parseInt(document.getElementById('f-max').value, 10) || 100;
      if(!title || !deadline){ showToast('Judul dan tenggat wajib diisi.'); return; }

      var classIds = state.newItemDraft.classIds;
      if(!classIds || classIds.length === 0){ showToast('Pilih minimal 1 kelas tujuan.'); return; }

      var validClassNames = classNamesFromIds(classIds);
      var allStudentsInTarget = [];
      classIds.forEach(function(cid){
        var c = state.classes.find(function(x){ return x.id === cid; });
        if(c) c.students.forEach(function(s){ var n = studentName(s); if(allStudentsInTarget.indexOf(n)===-1) allStudentsInTarget.push(n); });
      });
      var targetStudents = (state.newItemDraft.targetStudents || []).filter(function(n){ return allStudentsInTarget.indexOf(n) !== -1; });

      var durationMinutes = null;
      var accessCode = null;
      if(state.newItemType === 'kuis'){
        var durationVal = document.getElementById('f-duration') ? document.getElementById('f-duration').value.trim() : '';
        durationMinutes = durationVal ? parseInt(durationVal, 10) : null;
        var accessCodeVal = document.getElementById('f-accesscode') ? document.getElementById('f-accesscode').value.trim() : '';
        accessCode = accessCodeVal || null;
      }

      var questions = null;
      if(state.newItemType === 'kuis'){
        questions = state.newQuizQuestions;
        for(var i=0;i<questions.length;i++){
          var q = questions[i];
          if(!q.text.trim() || q.options.some(function(o){ return !o.trim(); })){
            showToast('Lengkapi teks dan semua pilihan pada Soal ' + (i+1) + '.');
            return;
          }
        }
      }

      var imageUrl = null;
      try{
        imageUrl = await uploadImageIfAny('f-image');
      }catch(err){
        showToast(err.message || 'Gagal mengunggah gambar.');
        return;
      }

      var newAssignment = {
        id: uid(), classIds: classIds, targetStudents: targetStudents, title: title, desc: desc, deadline: deadline,
        maxScore: maxScore, createdAt: new Date().toISOString(), imageUrl: imageUrl,
        type: state.newItemType
      };
      if(questions) newAssignment.questions = questions;
      if(durationMinutes) newAssignment.durationMinutes = durationMinutes;
      if(accessCode) newAssignment.accessCode = accessCode;

      state.assignments.push(newAssignment);
      state.openForm = false;
      state.newQuizQuestions = [];
      saveAssignments();
      render();
      showToast((state.newItemType === 'kuis' ? 'Kuis' : 'Tugas') + ' baru dikirim ke: ' + validClassNames.join(', '));

    startQuiz: function(assignmentId){
      var a = state.assignments.find(function(x){ return x.id === assignmentId; });
      if(!a) return;
      if(a.accessCode){
        var codeInput = document.getElementById('quiz-access-' + assignmentId);
        var entered = codeInput ? codeInput.value.trim() : '';
        if(!entered){ showToast('Masukkan kode akses dari guru dulu.'); return; }
        if(entered.toLowerCase() !== String(a.accessCode).trim().toLowerCase()){
          showToast('Kode salah. Tanyakan kode kuis ke gurumu.');
          return;
        }
      }
      state.quizStarted[assignmentId] = true;
      if(!state.quizTimers[assignmentId]){
        state.quizTimers[assignmentId] = {
          startedAt: Date.now(),
          durationSeconds: a.durationMinutes ? a.durationMinutes*60 : null,
          autoSubmitted: false,
          violations: 0
        };
      }
      saveExamSession(assignmentId, state.quizTimers[assignmentId]);
      render();
    },
    submitQuiz: function(assignmentId, isAuto, reason){
      var a = state.assignments.find(function(x){ return x.id === assignmentId; });
      if(!a) return;
      var answers = [];
      for(var i=0;i<a.questions.length;i++){
        var q = a.questions[i];
        var qType = questionType(q);
        var ans;
        if(qType === 'pgk'){
          var checkedBoxes = document.querySelectorAll('.quiz-take-pgk-' + assignmentId + '-' + i + ':checked');
          ans = Array.prototype.map.call(checkedBoxes, function(cb){ return parseInt(cb.value, 10); });
          if(ans.length === 0){
            if(isAuto){ answers.push([]); continue; }
            showToast('Jawab semua soal dulu sebelum mengumpulkan (Soal ' + (i+1) + ' belum dijawab).');
            return;
          }
        } else if(qType === 'menjodohkan'){
          ans = [];
          var incomplete = false;
          for(var pi=0; pi<(q.pairs||[]).length; pi++){
            var sel = document.getElementById('quiz-take-match-' + assignmentId + '-' + i + '-' + pi);
            var val = sel && sel.value !== '' ? parseInt(sel.value, 10) : null;
            if(val === null) incomplete = true;
            ans.push(val);
          }
          if(incomplete){
            if(isAuto){ answers.push(ans); continue; }
            showToast('Jawab semua soal dulu sebelum mengumpulkan (Soal ' + (i+1) + ' belum lengkap dipasangkan).');
            return;
          }
        } else if(qType === 'uraian'){
          var ta = document.getElementById('quiz-take-uraian-' + assignmentId + '-' + i);
          ans = ta ? ta.value.trim() : '';
          if(!ans){
            if(isAuto){ answers.push(''); continue; }
            showToast('Jawab semua soal dulu sebelum mengumpulkan (Soal ' + (i+1) + ' belum dijawab).');
            return;
          }
        } else {
          var checked = document.querySelector('input[name="quiz-take-' + assignmentId + '-' + i + '"]:checked');
          if(!checked){
            if(isAuto){ answers.push(null); continue; }
            showToast('Jawab semua soal dulu sebelum mengumpulkan (Soal ' + (i+1) + ' belum dijawab).');
            return;
          }
          ans = parseInt(checked.value, 10);
        }
        answers.push(ans);
      }
      var result = computeQuizScore(a, answers);
      var now = new Date().toISOString();
      var existing = state.submissions.find(function(s){
        return s.assignmentId === assignmentId && s.studentName === state.identity.name;
      });
      var violationCount = (state.quizTimers[assignmentId] && state.quizTimers[assignmentId].violations) || 0;
      var autoNote = reason === 'pelanggaran'
        ? ' &mdash; dikumpulkan otomatis karena terlalu sering keluar dari halaman ulangan'
        : (isAuto ? ' &mdash; waktu habis' : '');
      var record = {
        id: existing ? existing.id : uid(), assignmentId: assignmentId, studentName: state.identity.name,
        content: 'Kuis dijawab: ' + result.correctCount + '/' + result.gradableCount + ' benar (otomatis)' + autoNote + (result.needsManualReview ? ' &mdash; ada soal uraian, menunggu dinilai guru' : ''),
        submittedAt: now, score: result.score, feedback: existing ? existing.feedback : '',
        studentAnswers: answers, violationCount: violationCount
      };
      if(existing){
        var idx = state.submissions.indexOf(existing);
        state.submissions[idx] = record;
      } else {
        state.submissions.push(record);
      }
      delete state.quizTimers[assignmentId];
      delete state.quizStarted[assignmentId];
      clearExamSession(assignmentId);
      saveSubmissions();
      render();
      showToast((reason === 'pelanggaran' ? 'Kuis dikumpulkan otomatis karena terdeteksi sering keluar halaman. ' : (isAuto ? 'Waktu habis! Kuis dikumpulkan otomatis. ' : 'Kuis dikumpulkan! ')) +
        (result.needsManualReview ? 'Ada soal uraian — nilai akhir menunggu guru menilai.' : 'Nilai kamu: ' + result.score + '/' + a.maxScore));
    },

    addStudent: function(){

      if(!cls) return;
      if(!name){ showToast('Isi nama siswa dulu.'); return; }
      var exists = cls.students.some(function(s){ return (typeof s==='string'?s:s.name) === name; });
      if(exists){ showToast('Nama itu sudah ada di daftar.'); return; }
      var pin = generatePin();
      cls.students.push({ name: name, pin: pin });
      cls.students.sort(function(a,b){

    importPastedStudents: function(){
      var textarea = document.getElementById('bulk-paste-names');
      var raw = textarea ? textarea.value : '';
      var names = raw.split(/\r?\n|,/).map(function(n){ return n.trim(); }).filter(Boolean);
      if(names.length === 0){ showToast('Tempel dulu daftar namanya.'); return; }
      bulkImportStudents(names);
    },
    importStudentFile: function(){
      var input = document.getElementById('bulk-file-input');
      if(!input || !input.files || input.files.length === 0){ showToast('Pilih file dulu.'); return; }
      if(typeof XLSX === 'undefined'){ showToast('Gagal memuat pembaca file. Periksa koneksi internet lalu muat ulang halaman.'); return; }
      var file = input.files[0];
      var reader = new FileReader();
      reader.onload = function(e){
        try{
          var data = new Uint8Array(e.target.result);
          var workbook = XLSX.read(data, {type:'array'});
          var sheet = workbook.Sheets[workbook.SheetNames[0]];
          var rows = XLSX.utils.sheet_to_json(sheet, {header:1});
          var names = [];
          rows.forEach(function(row, idx){
            var val = (row && row[0] != null) ? String(row[0]).trim() : '';
            if(!val) return;
            if(idx === 0 && /^nama$|^name$/i.test(val)) return; // lewati baris judul kolom
            names.push(val);
          });
          if(names.length === 0){ showToast('Tidak ada nama yang terbaca dari file itu.'); return; }
          bulkImportStudents(names);
        }catch(err){
          showToast('Gagal membaca file. Pastikan formatnya .xlsx, .xls, atau .csv.');
        }
      };
      reader.onerror = function(){ showToast('Gagal membaca file.'); };
      reader.readAsArrayBuffer(file);
    },

      var cls = currentClass();
      if(!cls) return;
      var student = cls.students.find(function(s){ return (typeof s==='string'?s:s.name) === name; });
      if(!student) return;
      var newPin = generatePin();
      if(typeof student === 'string'){

      if(!confirm('Hapus "' + name + '" dari daftar siswa? (Tugas & nilai yang sudah ada tidak ikut terhapus)')) return;
      cls.students = cls.students.filter(function(s){ return (typeof s==='string'?s:s.name) !== name; });

      render();

    deleteClass: function(){
      var cls = currentClass();
      if(!cls) return;
      if(!confirm('Hapus kelas "' + cls.name + '" dari daftar? Tugas yang HANYA dikirim ke kelas ini (tidak dikirim ke kelas lain) akan ikut terhapus beserta nilainya. Tindakan ini tidak bisa dibatalkan.')) return;
      var classId = cls.id;
      state.classes = state.classes.filter(function(c){ return c.id !== classId; });

      var removedAssignmentIds = [];
      state.assignments = state.assignments.map(function(a){
        var ids = assignmentClassIds(a).filter(function(id){ return id !== classId; });
        a.classIds = ids;
        return a;
      }).filter(function(a){
        if(a.classIds.length === 0){ removedAssignmentIds.push(a.id); return false; }
        return true;
      });
      state.submissions = state.submissions.filter(function(s){ return removedAssignmentIds.indexOf(s.assignmentId) === -1; });
      state.customScores = state.customScores.filter(function(r){ return r.classId !== classId; });

      saveClasses();
      saveAssignments();
      saveSubmissions();
      saveCustomScores();
      state.identity.classId = state.classes.length > 0 ? state.classes[0].id : null;
      state.tab = 'dashboard';
      render();
      showToast('Kelas dihapus.');
    },
    addCustomColumn: function(){
      var input = document.getElementById('f-new-column');
      var name = input.value.trim();
      if(!name){ showToast('Isi nama kolom nilai dulu.'); return; }
      var cls = currentClass();
      if(!cls) return;
      cls.customColumns = cls.customColumns || [];
      var exists = cls.customColumns.some(function(c){ return c.name.toLowerCase() === name.toLowerCase(); });
      if(exists){ showToast('Kolom dengan nama itu sudah ada.'); return; }
      cls.customColumns.push({ id: uid(), name: name });
      saveClasses();
      render();
      showToast('Kolom nilai "' + name + '" ditambahkan.');
    },
    removeCustomColumn: function(columnId){
      var cls = currentClass();
      if(!cls) return;
      if(!confirm('Hapus kolom nilai ini beserta semua nilai yang sudah diisi di dalamnya?')) return;
      cls.customColumns = (cls.customColumns || []).filter(function(c){ return c.id !== columnId; });
      state.customScores = state.customScores.filter(function(r){ return !(r.classId === cls.id && r.columnId === columnId); });
      saveClasses();
      saveCustomScores();
      render();
      showToast('Kolom nilai dihapus.');
    },
    saveCustomScore: async function(columnId, encodedName){
      var name = decodeURIComponent(encodedName);
      var cls = currentClass();
      if(!cls) return;
      var input = document.getElementById('custom-score-' + columnId + '__' + encodedName);
      var value = input ? input.value : '';
      var num = value === '' ? null : parseFloat(value);
      var score = (num == null || isNaN(num)) ? null : num;
      var existing = state.customScores.find(function(r){ return r.classId === cls.id && r.columnId === columnId && r.studentName === name; });
      if(existing){
        existing.score = score;
      } else {
        state.customScores.push({ classId: cls.id, columnId: columnId, studentName: name, score: score });
      }
      showToast('Menyimpan nilai…', 30000);
      var okCustom = await saveCustomScores();
      if(okCustom){
        var chkC = await verifySaved('customScores', JSON.stringify(state.customScores));
        if(chkC.ok) showToast('Nilai tersimpan di spreadsheet ✓');
        else showToast(chkC.msg, 12000);
      }
    }
  };

      '<div><label>Kirim ke Siswa Tertentu (opsional, kosongkan = semua siswa)</label><div style="max-height:140px;overflow-y:auto;background:var(--bg-alt);border:1.5px solid var(--line);border-radius:3px;padding:8px 12px;">' + studentChecklist + '</div></div>' +

  function renderGuruDashboard(){
    var cls = currentClass();
    if(!cls){
      return '<div class="empty-state" style="padding:50px 20px;"><span class="big">🏫</span>Pilih atau buat kelas dulu lewat tombol "+ Kelas Baru" di atas untuk melihat statistiknya.</div>';
    }
    var classAssignments = state.assignments.filter(function(a){ return assignmentClassIds(a).indexOf(cls.id) !== -1; });
    var classAssignmentIds = classAssignments.map(function(a){ return a.id; });
    var classSubs = state.submissions.filter(function(s){ return classAssignmentIds.indexOf(s.assignmentId) !== -1; });

    var totalKuis = classAssignments.filter(function(a){ return a.type === 'kuis'; }).length;
    var totalSoal = classAssignments.reduce(function(sum,a){ return sum + (a.type==='kuis' && a.questions ? a.questions.length : 0); }, 0);
    var uniquePeserta = [];
    classSubs.forEach(function(s){ if(uniquePeserta.indexOf(s.studentName)===-1) uniquePeserta.push(s.studentName); });
    var totalSesi = classSubs.length;

    var html = '<div class="stat-grid">' +
      '<div class="stat-card"><div class="stat-num">' + classAssignments.length + '</div><div class="stat-label">Total Tugas &amp; Kuis</div></div>' +
      '<div class="stat-card"><div class="stat-num">' + totalKuis + '</div><div class="stat-label">Total Kuis (' + totalSoal + ' soal)</div></div>' +
      '<div class="stat-card"><div class="stat-num">' + uniquePeserta.length + '</div><div class="stat-label">Total Peserta Aktif</div></div>' +
      '<div class="stat-card"><div class="stat-num">' + totalSesi + '</div><div class="stat-label">Total Pengumpulan</div></div>' +
    '</div>';

    // Tugas/Kuis Terbaru
    var latestAssignments = classAssignments.slice().sort(function(a,b){ return new Date(b.createdAt) - new Date(a.createdAt); }).slice(0,5);
    html += '<div class="dash-section"><h3>Tugas &amp; Kuis Terbaru</h3>';
    if(latestAssignments.length === 0){
      html += '<div class="empty-state" style="padding:20px;">Belum ada tugas atau kuis dibuat.</div>';
    } else {
      latestAssignments.forEach(function(a){
        html += '<div class="dash-list-row"><span>' + escapeHtml(a.title) + (a.type==='kuis'?' <span class="stamp ok" style="font-size:0.6rem;padding:1px 6px;transform:rotate(0deg);">KUIS</span>':'') + '</span>' +
          '<span class="dlr-meta">' + fmtDate(a.createdAt) + '</span></div>';
      });
    }
    html += '</div>';

    // Aktivitas Terbaru
    var latestSubs = classSubs.slice().sort(function(a,b){ return new Date(b.submittedAt) - new Date(a.submittedAt); }).slice(0,5);
    html += '<div class="dash-section"><h3>Aktivitas Terbaru</h3>';
    if(latestSubs.length === 0){
      html += '<div class="empty-state" style="padding:20px;">Belum ada aktivitas pengumpulan.</div>';
    } else {
      latestSubs.forEach(function(s){
        var a = state.assignments.find(function(x){ return x.id === s.assignmentId; });
        html += '<div class="dash-list-row"><span>' + escapeHtml(s.studentName) + ' mengumpulkan <b>' + escapeHtml(a?a.title:'(tugas dihapus)') + '</b></span>' +
          '<span class="dlr-meta">' + fmtDate(s.submittedAt) + '</span></div>';
      });
    }
    html += '</div>';

    // Grafik: Jumlah Peserta per Tugas/Kuis
    var byCount = classAssignments.map(function(a){
      return { title: a.title, count: classSubs.filter(function(s){ return s.assignmentId === a.id; }).length };
    }).sort(function(a,b){ return b.count - a.count; }).slice(0,6);
    var maxCount = Math.max.apply(null, byCount.map(function(x){ return x.count; }).concat([1]));
    html += '<div class="dash-section"><h3>Jumlah Peserta per Tugas/Kuis</h3>';
    if(byCount.length === 0){
      html += '<div class="empty-state" style="padding:20px;">Belum ada data.</div>';
    } else {
      byCount.forEach(function(x){
        var pct = Math.round((x.count / maxCount) * 100);
        html += '<div class="bar-row"><span class="bar-name" title="' + escapeHtml(x.title) + '">' + escapeHtml(x.title) + '</span>' +
          '<div class="bar-track"><div class="bar-fill" style="width:' + pct + '%;"></div></div>' +
          '<span class="bar-val">' + x.count + '</span></div>';
      });
    }
    html += '</div>';

    // Grafik: Rata-rata Nilai per Tugas/Kuis
    var byAvg = classAssignments.map(function(a){
      var scored = classSubs.filter(function(s){ return s.assignmentId === a.id && s.score != null; });
      if(scored.length === 0) return null;
      var avg = Math.round(scored.reduce(function(sum,s){ return sum + (s.score / a.maxScore) * 100; }, 0) / scored.length);
      return { title: a.title, avg: avg };
    }).filter(Boolean).slice(0,6);
    html += '<div class="dash-section"><h3>Rata-rata Nilai per Tugas/Kuis</h3>';
    if(byAvg.length === 0){
      html += '<div class="empty-state" style="padding:20px;">Belum ada nilai yang masuk.</div>';
    } else {
      byAvg.forEach(function(x){
        html += '<div class="bar-row"><span class="bar-name" title="' + escapeHtml(x.title) + '">' + escapeHtml(x.title) + '</span>' +
          '<div class="bar-track"><div class="bar-fill blue" style="width:' + x.avg + '%;"></div></div>' +
          '<span class="bar-val">' + x.avg + '%</span></div>';
      });
    }
    html += '</div>';

    // Grafik: Aktivitas 7 Hari Terakhir
    var days = [];
    for(var i=6;i>=0;i--){
      var d = new Date();
      d.setDate(d.getDate() - i);
      days.push(d);
    }
    var dayCounts = days.map(function(d){
      var key = d.toDateString();
      var count = classSubs.filter(function(s){ return new Date(s.submittedAt).toDateString() === key; }).length;
      return { label: d.toLocaleDateString('id-ID', {weekday:'short'}), count: count };
    });
    var maxDay = Math.max.apply(null, dayCounts.map(function(x){ return x.count; }).concat([1]));
    html += '<div class="dash-section"><h3>Aktivitas 7 Hari Terakhir</h3><div class="vbar-chart">';
    dayCounts.forEach(function(x){
      var heightPct = Math.round((x.count / maxDay) * 100);
      html += '<div class="vbar-col">' +
        '<div class="vbar-count">' + x.count + '</div>' +
        '<div class="vbar-fill" style="height:' + Math.max(heightPct,3) + '%;"></div>' +
        '<div class="vbar-label">' + x.label + '</div>' +
      '</div>';
    });
    html += '</div></div>';

    return html;
  }

              (a.type==='kuis' && s.studentAnswers ? renderQuizBreakdown(a, s.studentAnswers) : '') +

              '<input type="text" id="fb-' + s.id + '" placeholder="Catatan (opsional)" value="' + escapeHtml(s.feedback||'') + '" style="width:160px;">' +
              '<button class="btn small primary" onclick="__actions.saveGrade(\'' + s.id + '\')">Simpan</button>' +
            '</div>' +
          '</div>';
        });
      }
      html += '</div>';
    }
    html += '</div>';
    return html;

  function renderRekapNilai(){
    var cls = currentClass();
    var classAssignments = state.assignments.filter(function(a){ return assignmentClassIds(a).indexOf(cls.id) !== -1; });
    var classAssignmentIds = classAssignments.map(function(a){ return a.id; });
    var classSubs = state.submissions.filter(function(s){ return classAssignmentIds.indexOf(s.assignmentId) !== -1; });
    var customColumns = cls.customColumns || [];
    var classCustomScores = state.customScores.filter(function(r){ return r.classId === cls.id; });

    var students = cls.students.map(studentName);
    classSubs.forEach(function(s){
      if(students.indexOf(s.studentName) === -1) students.push(s.studentName);
    });
    students.sort();

    var addColumnHtml = '<div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;">' +
      '<input type="text" id="f-new-column" placeholder="Nama kolom, contoh: UTS, Nilai Sikap" style="max-width:220px;">' +
      '<button class="btn primary small" onclick="__actions.addCustomColumn()">+ Tambah Kolom Nilai</button>' +
    '</div>';

    if(students.length === 0){
      return addColumnHtml + '<div class="empty-state"><span class="big">📊</span>Rekap nilai akan muncul di sini setelah ada siswa di kelas ini.</div>';
    }
    if(classAssignments.length === 0 && customColumns.length === 0){
      return addColumnHtml + '<div class="empty-state"><span class="big">📊</span>Belum ada tugas/kuis maupun kolom nilai tambahan. Buat tugas di tab "Tugas Kelas", atau tambah kolom nilai manual di atas.</div>';
    }

    var assignmentsSorted = classAssignments.slice().sort(function(a,b){ return new Date(a.createdAt) - new Date(b.createdAt); });

    var html = addColumnHtml + '<div class="table-wrap"><table><thead><tr><th>Siswa</th>';
    assignmentsSorted.forEach(function(a){ html += '<th>' + escapeHtml(a.title) + '</th>'; });
    customColumns.forEach(function(col){
      html += '<th>' + escapeHtml(col.name) + ' <button class="btn small ghost" style="padding:1px 6px;font-size:0.62rem;" onclick="__actions.removeCustomColumn(\'' + col.id + '\')" title="Hapus kolom ini">✕</button></th>';
    });
    if(assignmentsSorted.length > 0) html += '<th>Rata-rata Tugas Aplikasi</th>';
    html += '</tr></thead><tbody>';

    students.forEach(function(name){
      html += '<tr><td>' + escapeHtml(name) + '</td>';
      var total = 0, count = 0;
      assignmentsSorted.forEach(function(a){
        var notTargeted = a.targetStudents && a.targetStudents.length > 0 && a.targetStudents.indexOf(name) === -1;
        var sub = classSubs.find(function(s){ return s.assignmentId === a.id && s.studentName === name; });
        if(notTargeted){
          html += '<td class="score-empty" title="Tugas ini tidak ditujukan untuk siswa ini">&ndash;</td>';
        } else if(sub && sub.score != null){
          html += '<td class="score-cell">' + sub.score + '/' + a.maxScore + '</td>';
          total += (sub.score / a.maxScore) * 100;
          count++;
        } else {
          html += '<td class="score-empty">-</td>';
        }
      });
      customColumns.forEach(function(col){
        var rec = classCustomScores.find(function(r){ return r.columnId === col.id && r.studentName === name; });
        var val = rec && rec.score != null ? rec.score : '';
        var inputId = 'custom-score-' + col.id + '__' + encodeURIComponent(name);
        html += '<td><input type="number" id="' + inputId + '" value="' + escapeHtml(String(val)) + '" placeholder="-" style="width:64px;padding:4px 6px;font-size:0.8rem;" onchange="__actions.saveCustomScore(\'' + col.id + '\',\'' + encodeURIComponent(name) + '\')"></td>';
      });
      if(assignmentsSorted.length > 0){
        var avg = count > 0 ? Math.round(total / count) : null;
        html += '<td class="avg-col">' + (avg==null ? '-' : avg + '%') + '</td>';
      }
      html += '</tr>';
    });
    html += '</tbody></table></div>';
    return html;
  }

  function renderSiswaAssignmentCard(a){
    var mySub = state.submissions.find(function(s){ return s.assignmentId === a.id && s.studentName === state.identity.name; });
    var isLate = mySub && new Date(mySub.submittedAt) > new Date(a.deadline);
    var pastDeadline = new Date() > new Date(a.deadline);

    var statusStamp;
    if(mySub){
      statusStamp = '<span class="stamp ' + (isLate?'late':'ok') + '">' + (isLate?'Terlambat':'Dikumpulkan') + '</span>';
    } else {
      statusStamp = '<span class="stamp pending">' + (pastDeadline?'Lewat tenggat':'Belum dikumpulkan') + '</span>';
    }

    var html = '<div class="card torn">' +
      '<div class="card-head">' +
        '<div><h3>' + escapeHtml(a.title) + (a.type==='kuis' ? ' <span class="stamp ok" style="font-size:0.65rem;padding:2px 8px;transform:rotate(0deg);">KUIS</span>' : '') + '</h3>' +
          '<div class="card-meta">Tenggat: ' + fmtDate(a.deadline) + ' &middot; Maks. nilai ' + a.maxScore + (a.type==='kuis' ? ' &middot; ' + a.questions.length + ' soal' + (a.durationMinutes ? ' &middot; ' + a.durationMinutes + ' menit' : '') : '') + '</div></div>' +
        '<div>' + statusStamp + '</div>' +
      '</div>' +
      (a.desc ? '<div class="card-desc">' + escapeHtml(a.desc) + '</div>' : '') +
      (a.imageUrl ? '<img class="attach-img" src="' + escapeHtml(driveImageSrc(a.imageUrl)) + '" alt="Lampiran tugas">' : '');

    if(mySub){
      if(a.type === 'kuis' && mySub.studentAnswers){
        html += '<div class="subs">' +
          (mySub.score != null
            ? '<div style="color:var(--yellow);font-family:\'Special Elite\';margin-bottom:6px;">Nilai kamu: ' + mySub.score + '/' + a.maxScore + '</div>'
            : '<div style="color:var(--chalk-dim);font-size:0.85rem;margin-bottom:6px;">Ada soal uraian di kuis ini &mdash; menunggu dinilai guru.</div>') +
          renderQuizBreakdown(a, mySub.studentAnswers) +
        '</div>';
      } else {
        html += '<div class="subs"><div class="sub-content" style="max-width:none;">Jawaban kamu: ' + escapeHtml(mySub.content) + '</div>' +
          (mySub.imageUrl ? '<img class="sub-attach-img" src="' + escapeHtml(driveImageSrc(mySub.imageUrl)) + '" alt="Foto kumpulan kamu">' : '');
        if(mySub.score != null){
          html += '<div style="margin-top:10px;color:var(--yellow);font-family:\'Special Elite\';">Nilai: ' + mySub.score + '/' + a.maxScore +
            (mySub.feedback ? ' &middot; Catatan guru: ' + escapeHtml(mySub.feedback) : '') + '</div>';
        } else {
          html += '<div style="margin-top:10px;color:var(--chalk-dim);font-size:0.85rem;">Menunggu penilaian guru.</div>';
        }
        html += '</div>';
      }
    } else if(a.type === 'kuis'){
      if(!state.quizStarted[a.id]){
        var savedSession = loadExamSession(a.id);
        if(savedSession){
          state.quizStarted[a.id] = true;
          state.quizTimers[a.id] = savedSession;
        }
      }
      var started = state.quizStarted[a.id];
      if(!started){
        html += '<div class="subs">' +
          '<div style="color:var(--chalk-dim);font-size:0.88rem;margin-bottom:14px;">' +
            (a.durationMinutes ? 'Kuis ini punya batas waktu ' + a.durationMinutes + ' menit, dihitung sejak kamu klik Mulai.' : 'Soal tidak akan tampil sampai kamu klik tombol di bawah ini.') +
          '</div>' +
          '<div style="color:var(--coral);font-size:0.78rem;margin-bottom:14px;">🔒 Setelah dimulai, jangan tinggalkan halaman ini (pindah tab/aplikasi lain akan tercatat sebagai pelanggaran).</div>' +
          (a.accessCode ? '<div style="margin-bottom:12px;max-width:240px;"><label style="margin-bottom:5px;">Kode dari Guru</label><input type="text" id="quiz-access-' + a.id + '" placeholder="Masukkan kode kuis"></div>' : '') +
          '<button class="btn primary" onclick="__actions.startQuiz(\'' + a.id + '\')">▶ Mulai Kuis</button>' +
        '</div>';
      } else {
        if(!state.quizTimers[a.id]){
          state.quizTimers[a.id] = { startedAt: Date.now(), durationSeconds: a.durationMinutes ? a.durationMinutes*60 : null, autoSubmitted:false, violations:0 };
          saveExamSession(a.id, state.quizTimers[a.id]);
        }
        html += '<div class="subs">';
        if(a.durationMinutes){
          html += '<div style="margin-bottom:14px;font-family:\'Special Elite\';color:var(--yellow);font-size:1.1rem;">⏱ Sisa waktu: <span id="quiz-timer-' + a.id + '">--:--</span></div>';
        }
        a.questions.forEach(function(q, idx){
          var qType = questionType(q);
          html += '<div class="quiz-take-question">' +
            '<div class="qtext">' + (idx+1) + '. ' + escapeHtml(q.text) + '</div>';
          if(qType === 'pgk'){
            q.options.forEach(function(opt, oi){
              html += '<label class="quiz-take-opt">' +
                '<input type="checkbox" class="quiz-take-pgk-' + a.id + '-' + idx + '" value="' + oi + '">' +
                '<span>' + optionLetter(oi) + '. ' + escapeHtml(opt) + '</span>' +
              '</label>';
            });
            html += '<div style="font-size:0.72rem;color:var(--chalk-dim);margin-top:4px;">Boleh centang lebih dari satu jawaban.</div>';
          } else if(qType === 'menjodohkan'){
            var pairs = q.pairs || [];
            // sisi kanan diacak urutan tampilannya, tapi value tiap <option> tetap index aslinya
            var shuffledRight = pairs.map(function(p, i){ return {text: p.right, origIndex: i}; });
            for(var si = shuffledRight.length - 1; si > 0; si--){
              var rj = Math.floor(Math.random() * (si + 1));
              var tmp = shuffledRight[si]; shuffledRight[si] = shuffledRight[rj]; shuffledRight[rj] = tmp;
            }
            pairs.forEach(function(p, pi){
              html += '<div class="quiz-take-match-row">' +
                '<div class="m-left">' + (pi+1) + '. ' + escapeHtml(p.left) + '</div>' +
                '<select id="quiz-take-match-' + a.id + '-' + idx + '-' + pi + '">' +
                  '<option value="">— pilih pasangan —</option>' +
                  shuffledRight.map(function(r){ return '<option value="' + r.origIndex + '">' + escapeHtml(r.text) + '</option>'; }).join('') +
                '</select>' +
              '</div>';
            });
          } else if(qType === 'uraian'){
            html += '<textarea id="quiz-take-uraian-' + a.id + '-' + idx + '" rows="3" placeholder="Tulis jawabanmu di sini..." style="width:100%;"></textarea>';
          } else {
            q.options.forEach(function(opt, oi){
              html += '<label class="quiz-take-opt">' +
                '<input type="radio" name="quiz-take-' + a.id + '-' + idx + '" value="' + oi + '">' +
                '<span>' + optionLetter(oi) + '. ' + escapeHtml(opt) + '</span>' +
              '</label>';
            });
          }
          html += '</div>';
        });
        html += '<div style="font-size:0.78rem;color:var(--chalk-dim);margin-bottom:10px;">Periksa lagi semua jawaban sebelum mengirim &mdash; setelah dikirim, jawaban tidak bisa diubah.</div>';
        html += '<div style="text-align:right;"><button class="btn primary small" onclick="__actions.submitQuiz(\'' + a.id + '\')">✔ Kumpulkan Jawaban</button></div>';
        html += '</div>';
      }
    } else {
      html += '<div class="subs">' +
        '<textarea id="sub-content-' + a.id + '" placeholder="Tulis jawaban atau tempel tautan tugas di sini..."></textarea>' +
        '<div style="margin-top:10px;"><label style="margin-bottom:5px;">Lampirkan foto (opsional, maks 4MB)</label><input type="file" id="sub-image-' + a.id + '" accept="image/*"></div>' +
        '<div style="margin-top:10px;text-align:right;"><button class="btn primary small" onclick="__actions.submitWork(\'' + a.id + '\')">Kumpulkan Tugas</button></div>' +
      '</div>';
    }
    html += '</div>';
    return html;
  }

  function renderSiswaTugas(){

  // Kalender bulan berjalan, menandai hari ini dan hari-hari yang punya tenggat tugas.
  function renderMiniCalendar(classAssignments){
    var now = new Date();
    var year = now.getFullYear(), month = now.getMonth();
    var monthNames = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
    var firstDay = new Date(year, month, 1).getDay();
    var daysInMonth = new Date(year, month+1, 0).getDate();
    var todayDate = now.getDate();

    var dueDays = {};
    classAssignments.forEach(function(a){
      if(!a.deadline) return;
      var d = new Date(a.deadline);
      if(!isNaN(d) && d.getFullYear()===year && d.getMonth()===month){ dueDays[d.getDate()] = true; }
    });

    var html = '<div class="cal-widget"><div class="cal-head"><h3>' + monthNames[month] + ' ' + year + '</h3></div>';
    html += '<div class="cal-grid">';
    ['Min','Sen','Sel','Rab','Kam','Jum','Sab'].forEach(function(d){ html += '<div class="cal-dow">' + d + '</div>'; });
    for(var i=0;i<firstDay;i++){ html += '<div class="cal-day"></div>'; }
    for(var day=1; day<=daysInMonth; day++){
      var dayCls = 'cal-day cur-month';
      if(day === todayDate) dayCls += ' today';
      if(dueDays[day]) dayCls += ' due';
      html += '<div class="' + dayCls + '">' + day + '</div>';
    }
    html += '</div></div>';
    return html;
  }

  // ---- Lencana Prestasi (Badges) siswa ----
  // Semua kriteria dihitung dari data yang sudah ada (submissions, assignments, pesan)
  // sehingga tidak perlu penyimpanan tambahan.
  var BADGE_DEFS = [
    {
      id: 'langkah-pertama', icon: '🌱', title: 'Langkah Pertama',
      desc: 'Mengumpulkan tugas atau kuis untuk pertama kalinya.',
      check: function(ctx){ return ctx.mySubs.length >= 1; }
    },
    {
      id: 'rajin-mengumpulkan', icon: '📚', title: 'Rajin Mengumpulkan',
      desc: 'Mengumpulkan semua tugas & kuis yang diberikan di kelas ini.',
      check: function(ctx){ return ctx.totalCount >= 3 && ctx.doneCount === ctx.totalCount; }
    },
    {
      id: 'nilai-sempurna', icon: '🏅', title: 'Nilai Sempurna',
      desc: 'Meraih nilai penuh (100%) pada salah satu tugas atau kuis.',
      check: function(ctx){
        return ctx.classAssignments.some(function(a){
          var s = ctx.mySubMap[a.id];
          return s && s.score != null && a.maxScore && s.score >= a.maxScore;
        });
      }
    },
    {
      id: 'tepat-waktu', icon: '⏰', title: 'Selalu Tepat Waktu',
      desc: 'Tidak pernah terlambat mengumpulkan tugas berbatas waktu (minimal 3 tugas).',
      check: function(ctx){
        var withDeadline = ctx.classAssignments.filter(function(a){ return !!a.deadline; });
        if(withDeadline.length < 3) return false;
        return withDeadline.every(function(a){
          var s = ctx.mySubMap[a.id];
          return s && s.submittedAt && new Date(s.submittedAt) <= new Date(a.deadline);
        });
      }
    },
    {
      id: 'kuis-master', icon: '🧠', title: 'Kuis Master',
      desc: 'Menyelesaikan sedikitnya 3 kuis di kelas ini.',
      check: function(ctx){
        var kuis = ctx.classAssignments.filter(function(a){ return a.type === 'kuis'; });
        var done = kuis.filter(function(a){ var s = ctx.mySubMap[a.id]; return s && s.score != null; });
        return done.length >= 3;
      }
    },
    {
      id: 'nilai-konsisten', icon: '📈', title: 'Nilai Konsisten Tinggi',
      desc: 'Rata-rata nilai 90% ke atas dari minimal 3 tugas/kuis yang sudah dinilai.',
      check: function(ctx){
        var pcts = ctx.classAssignments.map(function(a){
          var s = ctx.mySubMap[a.id];
          return (s && s.score != null && a.maxScore) ? (s.score/a.maxScore)*100 : null;
        }).filter(function(v){ return v != null; });
        if(pcts.length < 3) return false;
        var avg = pcts.reduce(function(x,y){ return x+y; },0) / pcts.length;
        return avg >= 90;
      }
    },
    {
      id: 'bintang-kelas', icon: '⭐', title: 'Bintang Kelas',
      desc: 'Meraih rata-rata nilai tertinggi di kelas ini.',
      check: function(ctx){
        var students = ctx.cls.students || [];
        if(students.length < 2 || ctx.classAssignments.length < 3) return false;
        var bestName = null, bestAvg = -1, myAvg = null;
        students.forEach(function(name){
          var subs = state.submissions.filter(function(s){ return s.studentName === name; });
          var pcts = ctx.classAssignments.map(function(a){
            var s = subs.find(function(x){ return x.assignmentId === a.id; });
            return (s && s.score != null && a.maxScore) ? (s.score/a.maxScore)*100 : null;
          }).filter(function(v){ return v != null; });
          if(pcts.length === 0) return;
          var avg = pcts.reduce(function(x,y){ return x+y; },0) / pcts.length;
          if(avg > bestAvg){ bestAvg = avg; bestName = name; }
          if(name === ctx.myName) myAvg = avg;
        });
        return bestName === ctx.myName && myAvg != null;
      }
    },
    {
      id: 'aktif-berdiskusi', icon: '💬', title: 'Aktif Berdiskusi',
      desc: 'Mengirim sedikitnya 5 pesan lewat menu Pesan.',
      check: function(ctx){
        var sent = state.privateMessages.filter(function(m){ return m.senderName === ctx.myName; });
        return sent.length >= 5;
      }
    },
    {
      id: 'disiplin-ujian', icon: '🛡️', title: 'Disiplin Ujian',
      desc: 'Menyelesaikan kuis tanpa satupun pelanggaran (keluar halaman/tab).',
      check: function(ctx){
        return ctx.classAssignments.some(function(a){
          if(a.type !== 'kuis') return false;
          var s = ctx.mySubMap[a.id];
          return s && s.score != null && s.violationCount === 0;
        });
      }
    }
  ];

  function computeStudentBadges(myName, cls, classAssignments, mySubMap, mySubs, totalCount, doneCount){
    var ctx = {
      myName: myName, cls: cls, classAssignments: classAssignments,
      mySubMap: mySubMap, mySubs: mySubs, totalCount: totalCount, doneCount: doneCount
    };
    return BADGE_DEFS.map(function(b){
      var earned = false;
      try{ earned = !!b.check(ctx); }catch(e){ earned = false; }
      return { id: b.id, icon: b.icon, title: b.title, desc: b.desc, earned: earned };
    });
  }

  function renderSiswaDashboard(){

      var s = mySubMap[a.id];
      return (s && s.score != null) ? (s.score / a.maxScore) * 100 : null;
    }).filter(function(v){ return v != null; });
    var avgScore = scoredPcts.length ? Math.round(scoredPcts.reduce(function(a,b){ return a+b; },0) / scoredPcts.length) : null;

    var upcoming = classAssignments.filter(function(a){ return !mySubMap[a.id]; }).sort(function(a,b){
      var da = a.deadline ? new Date(a.deadline) : new Date(8640000000000000);
      var db = b.deadline ? new Date(b.deadline) : new Date(8640000000000000);
      return da - db;
    }).slice(0,3);

    var firstName = myName.split(' ')[0];
    var html = '<div class="hero-banner">' +
      '<div class="hero-text">' +
        '<h2>Selamat datang kembali, ' + escapeHtml(firstName) + '</h2>' +
        '<p>' + (totalCount > 0
          ? ('Kamu sudah menyelesaikan ' + pct + '% dari ' + totalCount + ' tugas di kelas ' + escapeHtml(cls.name) + '.' + (pct >= 80 ? ' Terus pertahankan!' : ''))
          : ('Belum ada tugas di kelas ' + escapeHtml(cls.name) + ' saat ini.')) + '</p>' +

      '<div class="hero-illus">' + DASHBOARD_HERO_SVG + '</div>' +
    '</div>';

    var studentBadges = computeStudentBadges(myName, cls, classAssignments, mySubMap, mySubs, totalCount, doneCount);
    html += renderBadgeSection(studentBadges);

    html += '<div class="dash2-grid"><div>';

    html += '<div class="dash-section"><h3>Tugas Mendatang</h3>';
    if(upcoming.length === 0){
      html += '<div class="empty-state" style="padding:24px;"><span class="big">📜</span>' +
        (totalCount === 0 ? 'Belum ada tugas di kelas ini.' : 'Tidak ada tugas yang menunggu. Kerja bagus!') + '</div>';
    } else {
      html += '<div class="task-card-row">';
      upcoming.forEach(function(a){
        html += '<div class="task-mini-card ' + (a.type==='kuis'?'kuis':'') + '">' +
          '<h4>' + escapeHtml(a.title) + '</h4>' +
          '<div class="tmc-meta">Tenggat: ' + fmtDate(a.deadline) + '</div>' +
          '<span class="stamp ' + (a.type==='kuis'?'ok':'pending') + '" style="margin-top:10px;display:inline-block;">' + (a.type==='kuis'?'Kuis':'Tugas') + '</span>' +
        '</div>';
      });
      html += '</div>';
    }
    html += '</div>';

    html += '<div class="dash-section"><h3>Riwayat Tugas &amp; Nilai</h3>';
    if(classAssignments.length === 0){
      html += '<div class="empty-state" style="padding:24px;">Belum ada tugas.</div>';
    } else {
      var recentAssignments = classAssignments.slice().sort(function(a,b){ return new Date(b.createdAt) - new Date(a.createdAt); }).slice(0,6);
      html += '<div class="table-wrap"><table><thead><tr><th>Tugas</th><th>Tipe</th><th>Status</th><th>Nilai</th></tr></thead><tbody>';
      recentAssignments.forEach(function(a){
        var s = mySubMap[a.id];
        var statusHtml, nilaiHtml;
        if(s && s.score != null){ statusHtml = '<span class="stamp ok">Dinilai</span>'; nilaiHtml = s.score + '/' + a.maxScore; }
        else if(s){ statusHtml = '<span class="stamp pending">Menunggu nilai</span>'; nilaiHtml = '-'; }
        else { statusHtml = '<span class="stamp late">Belum dikumpulkan</span>'; nilaiHtml = '-'; }
        html += '<tr><td>' + escapeHtml(a.title) + '</td><td>' + (a.type==='kuis'?'Kuis':'Tugas') + '</td><td>' + statusHtml + '</td><td>' + nilaiHtml + '</td></tr>';
      });
      html += '</tbody></table></div>';
    }
    html += '</div>';

    html += '</div><div>'; // kolom kanan

    html += '<div class="donut-wrap"><h3>Progres Tugas</h3>' +
      '<div class="donut" style="--pct:' + pct + '"><span>' + pct + '%</span></div>' +
      '<div class="donut-note">' + doneCount + ' dari ' + totalCount + ' tugas dikumpulkan' + (avgScore != null ? ' &middot; rata-rata ' + avgScore + '%' : '') + '</div>' +
    '</div>';

    var latestByThread = {};
    state.privateMessages.forEach(function(m){
      if(m.classId !== cls.id) return;
      var involved = (m.threadKey === guruThreadKey(myName));
      if(!involved && m.threadKey.indexOf('PEER::') === 0){
        var parts = m.threadKey.slice(6).split('::');
        involved = parts.indexOf(myName) !== -1;
      }
      if(!involved) return;
      if(!latestByThread[m.threadKey] || new Date(m.timestamp) > new Date(latestByThread[m.threadKey].timestamp)){
        latestByThread[m.threadKey] = m;
      }
    });
    var recentMsgs = Object.keys(latestByThread).map(function(k){ return latestByThread[k]; })
      .sort(function(a,b){ return new Date(b.timestamp) - new Date(a.timestamp); }).slice(0,4);

    html += '<div class="dash-section"><h3>Pesan Terbaru</h3>';

      html += '<div class="empty-state" style="padding:18px;">Belum ada percakapan.</div>';
    } else {
      html += '<div class="msg-mini-list">';
      recentMsgs.forEach(function(m){
        var label = threadContactLabel(m.threadKey, myName, 'siswa');
        var preview = (m.senderName === myName ? 'Kamu: ' : '') + m.text;
        if(preview.length > 46) preview = preview.slice(0,46) + '…';
        html += '<div class="msg-mini-row" onclick="__actions.setTab(\'pesan\')">' +
          '<div class="msg-mini-avatar">' + (m.threadKey.indexOf('GURU::')===0 ? '👩\u200d🏫' : '🎓') + '</div>' +
          '<div class="msg-mini-body"><b>' + escapeHtml(label) + '</b><span>' + escapeHtml(preview) + '</span></div>' +
        '</div>';
      });
      html += '</div>';
    }
    html += '</div>';

    html += renderMiniCalendar(classAssignments);

    html += '</div></div>'; // tutup kolom kanan & dash2-grid
    return html;
  }

  function renderSiswaNilai(){
    var cls = currentClass();
    var classAssignments = state.assignments.filter(function(a){
      return assignmentClassIds(a).indexOf(cls.id) !== -1 && isAssignmentVisibleToStudent(a, state.identity.name);
    });
    var mySubs = state.submissions.filter(function(s){ return s.studentName === state.identity.name; });
    var customColumns = cls.customColumns || [];
    var myCustomScores = state.customScores.filter(function(r){
      return r.classId === cls.id && r.studentName === state.identity.name;
    });
    if(classAssignments.length === 0 && customColumns.length === 0){
      return '<div class="empty-state"><span class="big">📊</span>Belum ada tugas yang dinilai.</div>';
    }
    var sorted = classAssignments.slice().sort(function(a,b){ return new Date(a.createdAt) - new Date(b.createdAt); });
    var html = '<div class="table-wrap"><table><thead><tr><th>Tugas</th><th>Nilai</th><th>Catatan</th></tr></thead><tbody>';
    var total = 0, count = 0;
    sorted.forEach(function(a){
      var sub = mySubs.find(function(s){ return s.assignmentId === a.id; });
      html += '<tr><td>' + escapeHtml(a.title) + '</td>';
      if(sub && sub.score != null){
        html += '<td class="score-cell">' + sub.score + '/' + a.maxScore + '</td><td>' + escapeHtml(sub.feedback||'-') + '</td>';
        total += (sub.score / a.maxScore) * 100; count++;

        html += '<td class="score-empty">Menunggu nilai</td><td>-</td>';
      } else {
        html += '<td class="score-empty">Belum dikumpulkan</td><td>-</td>';

      html += '</tr>';

    customColumns.forEach(function(col){
      var rec = myCustomScores.find(function(r){ return r.columnId === col.id; });
      html += '<tr><td>' + escapeHtml(col.name) + '</td>';

    html += '</tbody></table></div>';

    html += '<div style="margin-top:16px;font-family:\'Special Elite\';color:var(--yellow);">Rata-rata dari tugas yang sudah dinilai: ' + (avg==null?'-':avg+'%') + '</div>';
